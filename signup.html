<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account | Stackly Women's Health Center</title>
  <meta name="description" content="Register for Stackly Care Cloud as a Patient or Hospital Administrator.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=10">
  <link rel="icon" type="image/webp" href="assets/img/logo.webp">
</head>
<body style="background:#FAF9F5;">

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-card-top-bar">
        <a href="index.html" class="btn-back-home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>Back to Home</span>
        </a>
        <div class="portal-tag">
          <span>🌐 Telemetry Portal</span>
        </div>
      </div>

      <!-- Preview Image Banner (Matches Screenshot 4) -->
      <div class="auth-preview-banner">
        <img src="assets/img/admin-preview.webp" alt="Enterprise Clinical Analytics Infrastructure">
        <div class="auth-banner-label">
          <span>📊 Enterprise Clinical Analytics Infrastructure</span>
        </div>
      </div>

      <div class="auth-card-body">
        <div class="auth-logo-center">
          <img src="assets/img/stackly-icon.webp" alt="Stackly" class="logo-s-mark" style="height:32px;width:auto;">
          <span class="logo-brand-name" style="font-size:24px;">STACKLY</span>
          <span class="auth-cloud-badge">CARE CLOUD</span>
        </div>

        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle" id="roleNotice">Join 2,800+ patients & doctors operating on Stackly Care Cloud</p>

        <!-- Role Toggle Tabs [User] [Admin] (Matches Screenshot 4) -->
        <div class="role-toggle-group">
          <button type="button" class="role-toggle-btn active" id="toggleUser" data-role="user">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>User</span>
          </button>
          <button type="button" class="role-toggle-btn" id="toggleAdmin" data-role="admin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span>Admin</span>
          </button>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label class="auth-input-label">First Name *</label>
              <input type="text" id="signupFirstName" class="auth-input" placeholder="First Name" required value="Manasa">
            </div>
            <div class="form-group">
              <label class="auth-input-label">Last Name *</label>
              <input type="text" id="signupLastName" class="auth-input" placeholder="Last Name" required value="Lingala">
            </div>
          </div>

          <div class="form-group">
            <label class="auth-input-label">Work / Personal Email *</label>
            <input type="email" id="signupEmail" class="auth-input" placeholder="lingalamanasa123@gmail.com" required value="lingalamanasa123@gmail.com">
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label class="auth-input-label">Password *</label>
              <input type="password" class="auth-input" placeholder="••••••••" required value="SecretPass2026!">
            </div>
            <div class="form-group">
              <label class="auth-input-label">Confirm Password *</label>
              <input type="password" class="auth-input" placeholder="••••••••" required value="SecretPass2026!">
            </div>
          </div>

          <div class="auth-row-meta" style="margin-top:6px;">
            <label class="remember-label" style="font-size:12px;line-height:1.4;">
              <input type="checkbox" checked required style="accent-color:#967BB6;">
              <span>I agree to Stackly's <a href="#" style="color:#3B0764;font-weight:700;">Terms of Service</a>, <a href="#" style="color:#3B0764;font-weight:700;">SOC2 Security Agreement</a>, and <a href="#" style="color:#3B0764;font-weight:700;">Privacy Policy</a>.</span>
            </label>
          </div>

          <button type="submit" class="btn-auth-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
            <span>Create Account</span>
          </button>
        </form>

        <div class="auth-footer-prompt">
          Already have an account? <a href="login.html">Sign In here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
